name: bze tests

on:
  push:
    branches: [bze]
  pull_request:
    branches: [bze]

permissions:
  contents: read

concurrency:
  group: bze-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (full upstream suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache conda dependencies
        id: conda-dependencies
        uses: actions/cache@v5
        with:
          path: |
            /home/runner/conda_pkgs_dir/
            /usr/share/miniconda/envs
          key: ${{ runner.os }}-bze-conda-${{ hashFiles('setup/environment.yml') }}

      - name: Install environment and Hummingbot
        uses: ./.github/actions/install_env_and_hb
        with:
          program-cache-hit: 'false'
          dependencies-cache-hit: ${{ steps.conda-dependencies.outputs.cache-hit }}

      - name: BeeZee connector tests
        shell: bash
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate hummingbot
          python -m pytest test/hummingbot/connector/exchange/beezee

      # Some upstream connector tests (lambdaplex, coin_gecko) time out now and then on the hosted runner, on `bze` too.
      # Failed upstream tests get one rerun; a failed BeeZee test fails the job at once.
      - name: Full upstream suite
        shell: bash
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate hummingbot
          if make test; then
            exit 0
          fi
          failed=$(python -c 'import json; print("\n".join(json.load(open(".pytest_cache/v/cache/lastfailed"))))')
          if [ -z "$failed" ]; then
            echo "make test failed without a failed test to rerun"
            exit 1
          fi
          if grep -q "/exchange/beezee/" <<< "$failed"; then
            echo "BeeZee tests failed, no rerun:"
            echo "$failed"
            exit 1
          fi
          while read -r test_id; do
            echo "::warning::Upstream test failed, rerunning once: $test_id"
          done <<< "$failed"
          # The failed ids, not --last-failed: that would collect the dirs make test ignores.
          mapfile -t test_ids <<< "$failed"
          python -m pytest "${test_ids[@]}"
