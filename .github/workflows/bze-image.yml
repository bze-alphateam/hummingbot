name: bze image

on:
  push:
    branches: [bze]
  pull_request:
    branches: [bze]

permissions:
  contents: read
  packages: write

concurrency:
  group: bze-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build image (push on bze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Image metadata
        id: meta
        run: |
          echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3.12.0

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on bze)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/bze-alphateam/hummingbot:${{ steps.meta.outputs.sha8 }}
            ghcr.io/bze-alphateam/hummingbot:bze-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
